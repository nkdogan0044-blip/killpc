<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Almak için bas</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:20px}
    .card{width:min(92vw,380px);background:#fff;border-radius:22px;padding:34px 24px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.14)}
    h1{font-size:28px;margin:0 0 24px;color:#111}
    a{display:block;width:100%;padding:16px 20px;border-radius:14px;background:#111;color:#fff;text-decoration:none;font-size:24px;font-weight:800;letter-spacing:.5px}
    a:active{transform:scale(.98)}
  </style>
</head>
<body>
  <main class="card">
    <h1>Almak için bas</h1>
    <a href="https://www.youtube.com/watch?v=Bj4CF_ZAGJg">BAS</a>
  </main>
</body>
</html>
